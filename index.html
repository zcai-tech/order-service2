<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单管理</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --row-hover: #f8fafc;
      --status-paid: #059669;
      --status-pending: #d97706;
      --status-shipped: #2563eb;
      --status-cancelled: #dc2626;
      --status-refunded: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .field input,
    .field select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: end;
      justify-content: flex-end;
      margin-top: 12px;
    }

    button {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { background: var(--row-hover); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .summary {
      color: var(--muted);
      font-size: 14px;
    }

    .summary strong { color: var(--text); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: #fff;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
      color: var(--muted);
      font-weight: 600;
    }

    tbody tr:hover { background: var(--row-hover); }

    tbody tr:last-child td { border-bottom: none; }

    .amount { font-variant-numeric: tabular-nums; font-weight: 600; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f3f4f6;
      color: var(--muted);
    }

    .badge.paid { background: #d1fae5; color: var(--status-paid); }
    .badge.pending { background: #fef3c7; color: var(--status-pending); }
    .badge.shipped { background: #dbeafe; color: var(--status-shipped); }
    .badge.cancelled { background: #fee2e2; color: var(--status-cancelled); }
    .badge.refunded { background: #ede9fe; color: var(--status-refunded); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pager-left, .pager-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .pager button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .page-numbers {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .page-numbers button {
      min-width: 36px;
      padding: 0 8px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .page-numbers button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    @media (max-width: 900px) {
      .search-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .search-grid { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>订单管理</h1>
    <p class="subtitle">纯静态页面 · 默认 100 条订单 · 每页 10 条</p>

    <div class="card">
      <div class="search-grid">
        <div class="field">
          <label for="orderNo">订单号</label>
          <input id="orderNo" type="text" placeholder="如 ORD20260001" />
        </div>
        <div class="field">
          <label for="customer">客户姓名</label>
          <input id="customer" type="text" placeholder="输入客户姓名" />
        </div>
        <div class="field">
          <label for="status">订单状态</label>
          <select id="status">
            <option value="">全部</option>
            <option value="待支付">待支付</option>
            <option value="已支付">已支付</option>
            <option value="已发货">已发货</option>
            <option value="已取消">已取消</option>
            <option value="已退款">已退款</option>
          </select>
        </div>
        <div class="field">
          <label for="product">商品名称</label>
          <input id="product" type="text" placeholder="输入商品关键词" />
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn-secondary" id="resetBtn">重置</button>
        <button type="button" class="btn-primary" id="searchBtn">查询</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="summary" id="summary">共 <strong>0</strong> 条订单</div>
        <div class="summary">当前第 <strong id="currentPageText">1</strong> 页</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>客户</th>
              <th>商品</th>
              <th>数量</th>
              <th>金额（元）</th>
              <th>状态</th>
              <th>下单时间</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pager">
        <div class="pager-left">
          <span>每页</span>
          <strong>10</strong>
          <span>条</span>
        </div>
        <div class="pager-right">
          <button type="button" class="btn-secondary" id="prevBtn">上一页</button>
          <div class="page-numbers" id="pageNumbers"></div>
          <button type="button" class="btn-secondary" id="nextBtn">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var PAGE_SIZE = 10;
      var TOTAL = 100;
      var statuses = ["待支付", "已支付", "已发货", "已取消", "已退款"];
      var products = [
        "无线蓝牙耳机", "机械键盘", "27寸显示器", "移动电源", "智能手表",
        "笔记本电脑支架", "USB-C 扩展坞", "降噪耳麦", "固态硬盘 1TB", "摄像头"
      ];
      var surnames = ["张", "李", "王", "赵", "刘", "陈", "杨", "黄", "周", "吴"];
      var given = ["伟", "芳", "娜", "敏", "静", "强", "磊", "洋", "艳", "杰", "婷", "浩", "鹏", "雪", "超"];

      function pad(n, width) {
        var s = String(n);
        while (s.length < width) s = "0" + s;
        return s;
      }

      function formatDate(d) {
        var y = d.getFullYear();
        var m = pad(d.getMonth() + 1, 2);
        var day = pad(d.getDate(), 2);
        var h = pad(d.getHours(), 2);
        var mi = pad(d.getMinutes(), 2);
        return y + "-" + m + "-" + day + " " + h + ":" + mi;
      }

      function statusClass(status) {
        if (status === "已支付") return "paid";
        if (status === "待支付") return "pending";
        if (status === "已发货") return "shipped";
        if (status === "已取消") return "cancelled";
        if (status === "已退款") return "refunded";
        return "";
      }

      var orders = [];
      for (var i = 1; i <= TOTAL; i++) {
        var status = statuses[(i - 1) % statuses.length];
        var product = products[(i - 1) % products.length];
        var qty = ((i - 1) % 5) + 1;
        var unit = 39 + ((i * 17) % 960);
        var amount = (unit * qty).toFixed(2);
        var name = surnames[(i - 1) % surnames.length] + given[(i * 3) % given.length];
        var date = new Date(2026, 0, 1, 9, 0, 0);
        date.setMinutes(date.getMinutes() + i * 37);
        orders.push({
          orderNo: "ORD2026" + pad(i, 4),
          customer: name,
          product: product,
          quantity: qty,
          amount: amount,
          status: status,
          createdAt: formatDate(date)
        });
      }

      var state = {
        page: 1,
        filtered: orders.slice()
      };

      var els = {
        orderNo: document.getElementById("orderNo"),
        customer: document.getElementById("customer"),
        status: document.getElementById("status"),
        product: document.getElementById("product"),
        searchBtn: document.getElementById("searchBtn"),
        resetBtn: document.getElementById("resetBtn"),
        tableBody: document.getElementById("tableBody"),
        summary: document.getElementById("summary"),
        currentPageText: document.getElementById("currentPageText"),
        prevBtn: document.getElementById("prevBtn"),
        nextBtn: document.getElementById("nextBtn"),
        pageNumbers: document.getElementById("pageNumbers")
      };

      function getFilters() {
        return {
          orderNo: (els.orderNo.value || "").trim().toLowerCase(),
          customer: (els.customer.value || "").trim().toLowerCase(),
          status: els.status.value || "",
          product: (els.product.value || "").trim().toLowerCase()
        };
      }

      function applyFilter() {
        var f = getFilters();
        state.filtered = orders.filter(function (o) {
          if (f.orderNo && o.orderNo.toLowerCase().indexOf(f.orderNo) === -1) return false;
          if (f.customer && o.customer.toLowerCase().indexOf(f.customer) === -1) return false;
          if (f.status && o.status !== f.status) return false;
          if (f.product && o.product.toLowerCase().indexOf(f.product) === -1) return false;
          return true;
        });
        state.page = 1;
        render();
      }

      function totalPages() {
        return Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE));
      }

      function pageSlice() {
        var start = (state.page - 1) * PAGE_SIZE;
        return state.filtered.slice(start, start + PAGE_SIZE);
      }

      function renderTable() {
        var rows = pageSlice();
        if (!rows.length) {
          els.tableBody.innerHTML = '<tr><td colspan="7"><div class="empty">没有符合条件的订单</div></td></tr>';
          return;
        }
        var html = "";
        for (var i = 0; i < rows.length; i++) {
          var o = rows[i];
          html += "<tr>" +
            "<td>" + o.orderNo + "</td>" +
            "<td>" + o.customer + "</td>" +
            "<td>" + o.product + "</td>" +
            "<td>" + o.quantity + "</td>" +
            '<td class="amount">' + o.amount + "</td>" +
            '<td><span class="badge ' + statusClass(o.status) + '">' + o.status + "</span></td>" +
            "<td>" + o.createdAt + "</td>" +
            "</tr>";
        }
        els.tableBody.innerHTML = html;
      }

      function renderPager() {
        var pages = totalPages();
        if (state.page > pages) state.page = pages;
        els.currentPageText.textContent = String(state.page);
        els.summary.innerHTML = '共 <strong>' + state.filtered.length + '</strong> 条订单';
        els.prevBtn.disabled = state.page <= 1;
        els.nextBtn.disabled = state.page >= pages;

        var html = "";
        var maxButtons = 7;
        var start = Math.max(1, state.page - Math.floor(maxButtons / 2));
        var end = Math.min(pages, start + maxButtons - 1);
        start = Math.max(1, end - maxButtons + 1);

        for (var p = start; p <= end; p++) {
          html += '<button type="button" data-page="' + p + '"' +
            (p === state.page ? ' class="active"' : "") + ">" + p + "</button>";
        }
        els.pageNumbers.innerHTML = html;
      }

      function render() {
        renderTable();
        renderPager();
      }

      els.searchBtn.addEventListener("click", applyFilter);
      els.resetBtn.addEventListener("click", function () {
        els.orderNo.value = "";
        els.customer.value = "";
        els.status.value = "";
        els.product.value = "";
        state.filtered = orders.slice();
        state.page = 1;
        render();
      });

      els.prevBtn.addEventListener("click", function () {
        if (state.page > 1) {
          state.page -= 1;
          render();
        }
      });

      els.nextBtn.addEventListener("click", function () {
        if (state.page < totalPages()) {
          state.page += 1;
          render();
        }
      });

      els.pageNumbers.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-page]");
        if (!btn) return;
        state.page = Number(btn.getAttribute("data-page"));
        render();
      });

      ["orderNo", "customer", "product"].forEach(function (id) {
        els[id].addEventListener("keydown", function (e) {
          if (e.key === "Enter") applyFilter();
        });
      });

      render();
    })();
  </script>
</body>
</html>
